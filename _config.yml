# GitHub Pages: index.html is the landing page; the Markdown files in the repo
# root are served as rendered pages (/README, /README.he, /SECURITY) with
# relative .md links rewritten (jekyll-relative-links).
title: Google Photos Takeout Organizer
description: Merge Google Photos Takeout metadata back into your photos — correct dates, timezones, duplicates, and albums. Windows wizard + CLI.
theme: jekyll-theme-minimal
show_downloads: false
lang: en
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
# Note: README.md is served raw (text/markdown), not rendered — the readme_index
# plugin inside the github-pages gem claims that filename and neither removing it
# from `plugins` nor `readme_index: enabled: false` changes that. The landing page
# links to the README on github.com instead. /README.he and /SECURITY render fine.

relative_links:
  enabled: true
  collections: false
# jekyll-seo-tag: og:image / twitter:image for every page (link previews).
defaults:
  - scope:
      path: ""
    values:
      image: /docs/assets/social-preview.png
exclude:
  - src/
  - tests/
  - installer/
  - scripts/
  - .github/
  - "*.sln"
  - Directory.Build.props
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - DEVELOPMENT.md
  - ARCHITECTURE.md
  - ROADMAP.md
  - ROADMAP.he.md
